# Notaformat 백엔드 — Fly.io 배포 설정
#
# 이 파일은 flyctl 이 읽는 설정입니다. 실제 배포는 다음 순서로 합니다.
#   flyctl auth login
#   flyctl launch --no-deploy --copy-config   (앱 생성만, 이 파일 유지)
#   flyctl secrets set ...                    (환경변수 주입)
#   flyctl volumes create notaformat_data --size 3 --region nrt
#   flyctl deploy
#
# 자세한 절차는 DEPLOY.md 를 참고합니다.

app = "notaformat"
primary_region = "nrt"          # 도쿄. 한국에서 가장 가까운 리전입니다.

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # 변환 산출물을 볼륨 경로로 돌립니다. 이 값이 없으면 컨테이너 로컬에
  # 저장되어 재시작 시 사라집니다.
  CONVERTED_DIR = "/data/converted"
  UPLOADS_DIR = "/data/uploads"

[http_service]
  internal_port = 8000
  force_https = true

  # 변환은 수십 초가 걸리므로 요청 도중 머신이 멈추면 안 됩니다.
  # 최소 1대를 항상 켜 두어 콜드 스타트와 중단을 모두 피합니다.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    # Chromium 렌더링이 메모리를 많이 쓰므로 동시 처리를 낮게 잡습니다.
    soft_limit = 8
    hard_limit = 12

# 변환 산출물 영구 보관.
# 이것이 없으면 재배포·재시작마다 생성된 PDF 가 전부 사라집니다.
[mounts]
  source = "notaformat_data"
  destination = "/data"

[[vm]]
  # Playwright(Chromium) + LangGraph 를 함께 올리므로 메모리가 필요합니다.
  # 1GB 로는 렌더링 중 OOM 이 납니다.
  size = "shared-cpu-2x"
  memory = "2gb"

[checks]
  [checks.health]
    type = "http"
    port = 8000
    method = "GET"
    path = "/docs"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
